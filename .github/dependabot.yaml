# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Rust crates
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 0 * * *"
    groups:
      cargo-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      cargo-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
    labels:
      - "dependencies"
      - "rust"
      - "cargo"
    commit-message:
      prefix: "ci(deps)"
  # Rust toolchain
  - package-ecosystem: "rust-toolchain"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 0 * * *"
    labels:
      - "dependencies"
      - "rust"
      - "toolchain"
    commit-message:
      prefix: "ci(deps)"
  # CI dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 0 * * *"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(actions)"
